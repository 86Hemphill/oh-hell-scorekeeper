workflows:
  ios-testflight:
    name: iOS TestFlight build
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: Oh Hell Apple
    environment:
      xcode: "26.4"
      node: "20"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.hemphill.ohhellscorekeeper
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Run tests
        script: npm test
      - name: Build static web app
        script: npm run build:web
      - name: Sync iOS
        script: npm run cap:sync
      - name: Configure iOS code signing
        script: xcode-project use-profiles --project ios/App/App.xcodeproj
      - name: Build signed App Store IPA
        script: xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - ios/App/CapApp-SPM/Package.swift
    publishing:
      app_store_connect:
        auth: integration
  android-debug:
    name: Android debug APK
    instance_type: linux_x2
    max_build_duration: 120
    environment:
      ubuntu: "24.04"
      node: "20"
      java: "21"
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Run tests
        script: npm test
      - name: Build static web app
        script: npm run build:web
      - name: Sync Android
        script: npx --no-install cap sync android
      - name: Set Android SDK location
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
      - name: Build debug APK
        script: |
          cd android
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk
